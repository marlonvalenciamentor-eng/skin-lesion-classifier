# =============================================================================
# Pipeline de CI — SkinLesionClassifier (GitLab CI)
#   1. test / lint / typecheck  → verificación (Makefile + python:3.13-slim)
#   2. build-image              → construye y publica la imagen en Docker Hub
#   3. deploy                   → SSH al droplet, pull + run del contenedor
#
# Variables requeridas (Settings > CI/CD > Variables):
#   DOCKERHUB_USER, DOCKERHUB_TOKEN (Masked)
#   SSH_HOST, SSH_USER, SSH_KEY (File)
# =============================================================================

image: python:3.13-slim

before_script:
  - apt-get update && apt-get install -y make
  - pip install --no-cache-dir uv
  - uv sync

stages:
  - test
  - lint
  - typecheck
  - build
  - deploy

test:
  stage: test
  script:
    - make test

lint:
  stage: lint
  script:
    - make lint
    - make format-check

typecheck:
  stage: typecheck
  script:
    - make typecheck

build-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN"
  script:
    - docker build -f docker/Dockerfile -t "$DOCKERHUB_USER/skin-lesion-classifier:$CI_COMMIT_SHORT_SHA" -t "$DOCKERHUB_USER/skin-lesion-classifier:latest" .
    - docker push "$DOCKERHUB_USER/skin-lesion-classifier:$CI_COMMIT_SHORT_SHA"
    - docker push "$DOCKERHUB_USER/skin-lesion-classifier:latest"

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - chmod 400 "$SSH_KEY"
  script:
    - ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "docker pull $DOCKERHUB_USER/skin-lesion-classifier:latest && (docker stop skin-lesion-classifier || true) && (docker rm skin-lesion-classifier || true) && docker run -d -p 8501:8501 --restart unless-stopped --name skin-lesion-classifier $DOCKERHUB_USER/skin-lesion-classifier:latest"
