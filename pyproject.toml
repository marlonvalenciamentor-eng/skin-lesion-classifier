[project]
name = "skin-lesion-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marlonvalenciamentor-eng", email = "marlonvalenciamentor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.0",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.50",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not integration\""
markers = [
    "integration: downloads the real model from Hugging Face (slow, needs network)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
