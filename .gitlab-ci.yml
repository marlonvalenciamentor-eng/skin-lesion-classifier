# =============================================================================
# Pipeline de CI — SkinLesionClassifier (GitLab CI)
# Imagen: python:3.13-slim (Debian, ya trae apt + pip). Al usar `image:` se
# ejecuta en un runner Linux con Docker. Se instala make + uv y se corren las
# verificaciones vía el Makefile.
# =============================================================================

image: python:3.13-slim

before_script:
  - apt-get update && apt-get install -y make
  - pip install --no-cache-dir uv
  - uv sync

test:
  script:
    - make test

lint:
  script:
    - make lint
    - make format-check

typecheck:
  script:
    - make typecheck
