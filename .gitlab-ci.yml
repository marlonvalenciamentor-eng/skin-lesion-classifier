# =============================================================================
# Pipeline de CI — SkinLesionClassifier (GitLab CI)
# Imagen base: Debian 12 (bookworm) con Python 3.13 + uv preinstalados.
# Se instala make y se corren las verificaciones vía el Makefile.
# =============================================================================

image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

cache:
  paths:
    - .uv-cache/
    - .venv/

before_script:
  # make no viene en la imagen; se instala desde apt (Debian).
  - apt-get update && apt-get install -y make
  # Instala las dependencias del proyecto (torch CPU, transformers, streamlit...).
  - uv sync --locked

stages:
  - test
  - lint
  - typecheck

test:
  stage: test
  script:
    - make test

lint:
  stage: lint
  script:
    - make lint
    - make format-check

typecheck:
  stage: typecheck
  script:
    - make typecheck
