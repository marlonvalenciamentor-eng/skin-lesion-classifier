services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      # Named volume: los pesos del modelo se descargan una vez (caché de
      # Hugging Face) y nunca se hornean en la capa de imagen.
      - hf-cache:/home/appuser/.cache/huggingface
      - ./data/samples:/app/data/samples:ro
    healthcheck:
      test:
        - "CMD"
        - "/app/.venv/bin/python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous start_period: el primer arranque descarga el ViT de ~343 MB.
      start_period: 180s

volumes:
  hf-cache:
